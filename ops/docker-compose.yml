# ============================================================
# 美发智能知识助手 - 生产环境 docker-compose 部署
# ============================================================
# 启动命令: docker-compose up -d
# 查看日志: docker-compose logs -f
# 停止: docker-compose down

version: "3.8"

services:
  # --- 主服务：Agent + API ---
  hairstylist-agent:
    build:
      context: ..
      dockerfile: ops/Dockerfile
    container_name: hairstylist-agent
    restart: unless-stopped
    ports:
      - "7860:7860"
      - "9090:9090"
    environment:
      - HAIRSTYLIST_ENV=prod
      - PYTHONUNBUFFERED=1
    env_file:
      - ../.env
    volumes:
      - ../data:/app/data
    depends_on:
      - qdrant
    networks:
      - hairstylist-net

  # --- 向量库：Qdrant 生产模式（可选，本地模式不需要）---
  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: hairstylist-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - hairstylist-net

  # --- 监控面板：Grafana（可选）---
  # grafana:
  #   image: grafana/grafana:10.2.0
  #   container_name: hairstylist-grafana
  #   restart: unless-stopped
  #   ports:
  #     - "3000:3000"
  #   volumes:
  #     - grafana-data:/var/lib/grafana
  #   networks:
  #     - hairstylist-net

volumes:
  qdrant-data:
  # grafana-data:

networks:
  hairstylist-net:
    driver: bridge
