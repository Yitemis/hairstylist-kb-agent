# ============================================================
# 美发知识助手 - Milvus 向量库生产版
# ============================================================
# 启动：docker-compose up -d
# 面板：http://localhost:3000 （Attu 可视化）
# API 端口：19530

version: '3.8'

services:
  etcd:
    container_name: hairstylist-etcd
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: 1000
      ETCD_QUOTA_BACKEND_BYTES: 4294967296
      ETCD_SNAPSHOT_COUNT: 50000
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    networks:
      - hairstylist-net
    healthcheck:
      test: ['CMD', 'etcdctl', 'endpoint', 'health']
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    container_name: hairstylist-minio
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data
    networks:
      - hairstylist-net
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 3s
      retries: 5

  milvus:
    container_name: hairstylist-milvus
    image: milvusdb/milvus:v2.3.3
    command: ['milvus', 'run', 'standalone']
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    ports:
      - '19530:19530'
      - '9091:9091'
    networks:
      - hairstylist-net
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9091/healthz']
      interval: 5s
      timeout: 3s
      retries: 5

  attu:
    container_name: hairstylist-attu
    image: zilliz/attu:v2.3.3
    ports:
      - '3001:3000'
    environment:
      MILVUS_ADDR: milvus:19530
    networks:
      - hairstylist-net
    depends_on:
      milvus:
        condition: service_healthy

volumes:
  etcd_data:
    driver: local
  minio_data:
    driver: local
  milvus_data:
    driver: local

networks:
  hairstylist-net:
    driver: bridge