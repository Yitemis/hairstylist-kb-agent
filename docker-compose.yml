version: "3.9"

services:
  api:
    build: .
    container_name: hair-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./alembic:/app/alembic
    environment:
      - DATABASE_URL=sqlite+aiosqlite:////app/data/app.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # 火山方舟 Qdrant 向量库（轻量级，单文件存储）
  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: hair-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  # Milvus（生产级向量库，可选）
  milvus:
    image: milvusdb/milvus:v2.4.0
    container_name: hair-milvus
    profiles: ["milvus"]  # 默认不启动，需要时 --profile milvus
    ports:
      - "19530:19530"
    environment:
      ETCD_USE_EMBED: "false"
      COMMON_STORAGETYPE: "local"
    volumes:
      - milvus_data:/var/lib/milvus
    restart: unless-stopped

  # Redis (缓存)
  redis:
    image: redis:7-alpine
    container_name: hairstylist-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - hairstylist-net
    restart: unless-stopped


volumes:
  qdrant_data:
  milvus_data:

  # Prometheus 监控
  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: hairstylist-prometheus
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - hairstylist-net
    restart: unless-stopped
    depends_on:
      - milvus-standalone

  # Grafana 仪表盘
  grafana:
    image: grafana/grafana:10.4.2
    container_name: hairstylist-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - hairstylist-net
    restart: unless-stopped
    depends_on:
      - prometheus

volumes:
  grafana-data:
